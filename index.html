<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e9">
  <title>Pozvánka na křtiny</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #384c43;
      --sage: #738f7e;
      --cream: #f6f1e9;
      --paper: #fffdf8;
      --rose: #d5a999;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        radial-gradient(circle at 12% 15%, #e7e9dc 0 9%, transparent 27%),
        radial-gradient(circle at 88% 82%, #eddfd6 0 8%, transparent 28%),
        var(--cream);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }

    .card {
      position: relative;
      isolation: isolate;
      width: min(100%, 660px);
      padding: clamp(38px, 8vw, 64px) clamp(25px, 7vw, 62px) 32px;
      overflow: hidden;
      border: 1px solid #e9e2d7;
      border-radius: 3px;
      background: var(--paper);
      box-shadow: 0 22px 70px #4a554529, 0 2px 8px #4a554514;
      text-align: center;
    }

    .card::before {
      position: absolute;
      inset: 13px;
      z-index: -1;
      border: 1px solid #dadfd2;
      content: '';
      pointer-events: none;
    }

    .dove {
      display: block;
      width: 165px;
      height: auto;
      margin: -8px auto 19px;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--sage);
      font: 700 14px/1.3 Arial, sans-serif;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 65px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 150px;
      margin: 27px auto 30px;
      color: var(--rose);
      font-size: 17px;
    }

    .divider::before, .divider::after {
      flex: 1;
      height: 1px;
      background: #d8ded4;
      content: '';
    }

    /* Upravte pouze obsah tohoto bloku. Jeho výška se přizpůsobí počtu řádků. */
    .invitation-text {
      margin: 0 auto;
      max-width: 470px;
      font-size: clamp(20px, 3vw, 23px);
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .invitation-text p { margin: 0 0 .9em; }
    .invitation-text p:last-child { margin-bottom: 0; }
    .invitation-text strong { color: #96765f; font-weight: 400; }

    .play-area {
      position: relative;
      width: min(100%, 290px);
      margin: 36px auto 0;
    }

    .baby-button {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .baby-button:focus-visible {
      outline: 3px solid var(--sage);
      outline-offset: 6px;
      border-radius: 45%;
    }

    .baby-button svg { display: block; width: 100%; height: auto; overflow: visible; }
    .baby-button:hover .baby-art { transform: rotate(-2deg) translateY(-3px); }
    .baby-art { transform-origin: 145px 164px; transition: transform .25s ease; }
    .happy-expression, .crying-expression { transition: opacity .15s ease; }
    .crying-expression { opacity: 0; }
    .is-wet .happy-expression { opacity: 0; }
    .is-wet .crying-expression { opacity: 1; }

    .water {
      position: absolute;
      top: -42px;
      left: 50%;
      width: 160px;
      height: 155px;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      overflow: visible;
    }

    .water path {
      fill: none;
      stroke: #80c5d7;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 10 12;
    }

    .water circle { fill: #93d3df; }
    .is-pouring .water { opacity: 1; animation: water-fade 1.35s ease-in-out both; }
    .is-pouring .water path { animation: pour .42s linear infinite; }
    .is-pouring .water circle { animation: drip .65s ease-in infinite; }
    .is-pouring .water circle:nth-of-type(2) { animation-delay: .18s; }
    .is-pouring .water circle:nth-of-type(3) { animation-delay: .35s; }

    .hint {
      margin: 7px 0 0;
      color: #7b877c;
      font: 12px/1.5 Arial, sans-serif;
      letter-spacing: .035em;
    }

    @keyframes pour { to { stroke-dashoffset: -22; } }
    @keyframes water-fade { 0%, 100% { opacity: 0; } 12%, 75% { opacity: 1; } }
    @keyframes drip { 0% { transform: translateY(-12px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(55px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .is-pouring .water { opacity: 1; }
    }
  </style>
</head>

    </div>
  </main>

  <script>
    const babyButton = document.getElementById('baby-button');
    const playArea = document.getElementById('play-area');
    const babyCry = document.getElementById('baby-cry');

    // Skleněná konvička tvoří kurzor pouze nad miminkem. SVG je vložené přímo do souboru.
    const pitcher = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><path d="M12 9H34L31 39H15Z" fill="#dff5f8" fill-opacity=".75" stroke="#477b83" stroke-width="2"/><path d="M14 26H32L31 38H16Z" fill="#79c6d5" fill-opacity=".8"/><path d="M34 14H39C46 14 46 30 33 30" fill="none" stroke="#477b83" stroke-width="2.5"/><path d="M12 9L5 15L3 19L11 16" fill="#dff5f8" stroke="#477b83" stroke-width="2" stroke-linejoin="round"/><path d="M11 8H35" stroke="#477b83" stroke-width="2.5" stroke-linecap="round"/></svg>`;
    babyButton.style.cursor = `url("data:image/svg+xml,${encodeURIComponent(pitcher)}") 5 18, pointer`;

    let pouring = false;

    babyCry.addEventListener('ended', () => playArea.classList.remove('is-wet'));

    babyButton.addEventListener('click', () => {
      if (pouring) return;
      pouring = true;
      playArea.classList.remove('is-wet', 'is-pouring');
      void playArea.offsetWidth;
      playArea.classList.add('is-pouring');
      babyCry.currentTime = 0;
      babyCry.volume = 1;
      babyCry.play().catch(() => {});
      window.setTimeout(() => {
        playArea.classList.remove('is-pouring');
        playArea.classList.add('is-wet');
        babyButton.setAttribute('aria-label', 'Znovu polít miminko vodou');
      }, 900);
      window.setTimeout(() => { pouring = false; }, 4300);
    });
  </script>
